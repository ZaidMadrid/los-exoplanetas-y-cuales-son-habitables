<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Los Exoplanetas</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body id="pagina-exoplanetas">
    <header class="header-wireframe" style="padding-top: 15px; margin-bottom: 5px;">
        <img src="THINKING.png" alt="Thinking Space Logo" class="logo-img" style="left: 15px; top: 10px;">
        <h1 class="titulo-principal" style="font-size: 1.7rem;">CONTACTO</h1>
    </header>

    <main class="contenedor-principal" style="flex-direction: column; gap: 15px; max-width: 800px; width: 100%; margin: auto; padding: 10px;">
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;">
            <marquee behavior="alternate" scrollamount="3" style="width: 100%;">
                <p style="font-size: 1.1rem; font-weight: bold; color: #e2d9fc; margin: 0;">
                    CORREO: <span style="font-weight: normal; color: #ffffff;">zaidbernal41@gmail.com</span>
                </p>
            </marquee>
            
            <div style="display: flex; gap: 18px; align-items: center; justify-content: center; margin-bottom: 8px;">
                <a href="#" style="display: inline-block; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid #b19cd9;">
                    <img src="IMG_90a5ce89-5f55-4415-861d-1ed1209e0d0f.png" alt="Facebook" style="width: 100%; height: 100%; object-fit: cover;">
                </a>
                <a href="#" style="display: inline-block; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid #b19cd9;">
                    <img src="IMG_6c21ea9c-c793-4639-9ead-480b073c85de.jpg" alt="Instagram" style="width: 100%; height: 100%; object-fit: cover;">
                </a>
                <a href="#" style="display: inline-block; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid #b19cd9;">
                    <img src="IMG_c4da9e99-0c27-415f-8ae2-a295ce5506c8_edit_764120612528196.png" alt="TikTok" style="width: 100%; height: 100%; object-fit: cover;">
                </a>
            </div>
        </div>

        <section class="caja-informacion" style="max-height: 65vh; padding: 25px; text-align: left; width: 100%;">
            <marquee behavior="alternate" scrollamount="3" style="margin-bottom: 15px;">
                <h2 style="font-size: 1.4rem; color: #e2d9fc; text-align: center; margin: 0;">FORMULARIO</h2>
            </marquee>
            
            <form onsubmit="event.preventDefault(); alert('¡Formulario enviado con éxito!');" style="display: flex; flex-direction: column; gap: 14px; width: 100%;">
                <div>
                    <label style="font-size: 0.95rem; color: #b19cd9; display: block; margin-bottom: 5px;">¿Qué te pareció?</label>
                    <input type="text" required style="width: 100%; padding: 10px 14px; border-radius: 15px; border: 2px solid #b19cd9; background: rgba(30, 20, 50, 0.6); color: white; outline: none; font-size: 1rem;">
                </div>

                <div>
                    <label style="font-size: 0.95rem; color: #b19cd9; display: block; margin-bottom: 5px;">¿Qué puedo mejorar?</label>
                    <input type="text" required style="width: 100%; padding: 10px 14px; border-radius: 15px; border: 2px solid #b19cd9; background: rgba(30, 20, 50, 0.6); color: white; outline: none; font-size: 1rem;">
                </div>

                <div>
                    <label style="font-size: 0.95rem; color: #b19cd9; display: block; margin-bottom: 5px;">Escribe una sugerencia</label>
                    <textarea rows="3" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid #b19cd9; background: rgba(30, 20, 50, 0.6); color: white; outline: none; font-size: 1rem; resize: none;"></textarea>
                </div>

                <div style="text-align: right; margin-top: 5px;">
                    <button type="submit" class="btn-navegacion" style="width: auto; padding: 8px 25px; font-size: 0.95rem; margin: 0; cursor: pointer;">ENVIAR</button>
                </div>
            </form>
        </section>

    </main>

    <footer class="footer-wireframe" style="position: relative; width: 100%; padding-top: 20px; padding-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="position: absolute; top: -10px; left: 15px; font-size: 1.5rem; font-weight: bold; color: #00f2fe; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 5px rgba(0, 242, 254, 0.8);">4</span>
        
        <a href="index.html" class="btn-navegacion" style="margin: 0; width: auto; padding: 10px 30px; font-size: 0.95rem;">VOLVER AL INICIO</a>
        
        <div style="font-size: 0.8rem; color: #e2d9fc; text-align: center; opacity: 0.85; line-height: 1.3; padding: 0 10px;">
            <p style="margin: 0;">Luis Zaid Bernal Madrid | 5°B - Programación</p>
            <p style="margin: 0;">Maestra: Claudia Iriarte | Turno Vespertino</p>
        </div>
    </footer>
</body>
</html>
